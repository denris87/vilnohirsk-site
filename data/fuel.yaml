# ───────────────────────────────────────────────────────────────
#  Ціни на пальне АЗС «Укрнафта» — Вільногірськ
# ───────────────────────────────────────────────────────────────
#  ЦІНИ ОНОВЛЮЮТЬСЯ САМІ. Щогодини в будні (з 8 до 21 за Києвом) бот бере
#  ціни «Укрнафти» по Дніпропетровській області з index.minfin.com.ua (дані
#  «Консалтингової групи А-95») і міняє тут price та updated. Назви, кольори
#  й show не чіпає. Мінфін публікує ціни раз на день, близько обіду, і лише
#  в будні.
#
#  У суботу й неділю бот міняє ЛИШЕ ДАТУ на сьогоднішню, а ціни лишає
#  п'ятничні. Але тільки якщо в п'ятницю ціни таки оновились — інакше дату
#  не переносить, щоб не видати старі ціни за свіжі.
#
#  auto: true   — ціни оновлює бот
#  auto: false  — бот файл не чіпає, ціни ведуться вручну
#                 (напр. якщо на нашій АЗС ціна відрізняється від обласної)
#
#  Правити руками можна й не вимикаючи бота. Бот перепише ціни лише тоді,
#  коли в мінфіні з'являться дані на дату, НОВІШУ за updated. Вписали ціни
#  із сьогоднішньою датою — вони стоять, доки мінфін не дасть свіжіші.
#
#  updated — дата, станом на яку ціни (на сайті — "станом на").
#
#  show: true   — показувати блок цін на сайті
#  show: false  — сховати блок
#
#  Кожна позиція:
#    name  — назва пального (показується в КОЛЬОРІ color).
#            Бот знає назви 95E, 95, 92, ДП, Газ — інші не чіпає.
#    price — ціна у грн (формат "73.90"). Якщо немає пального — "—"
#    color — колір назви пального (hex). Ціна завжди біла.
# ───────────────────────────────────────────────────────────────

