# ───────────────────────────────────────────────────────────────
#  Графік вивозу сміття — Вільногірськ
# ───────────────────────────────────────────────────────────────
#  ГРАФІК ПОПЕРЕДНІЙ. Поки що на сайті не показується (show: false).
#
#  Перемикач:
#    show: true   — показувати графік на сайті
#    show: false  — сховати
#
#  updated — дата, станом на яку графік актуальний.
#
#  Структура:
#    routes — список маршрутів сміттєвоза. У кожного:
#      name  — назва маршруту, напр. "Маршрут №1"
#      stops — зупинки по черзі, як їде машина. У кожної зупинки:
#        address — вулиця й номери будинків через кому
#        time    — о котрій машина тут у будні, "ГГ:ХХ"
#        sunday  — о котрій у неділю, "ГГ:ХХ"
#
#  Якщо часу ще нема — просто не пишіть рядок time (або sunday).
#  Якщо в неділю машина їде в той самий час, що й у будні, sunday
#  теж не потрібен.
#
#  Приклад зупинки з обома часами:
#      - address: "вул. Центральна 53, 55, 55а, 57"
#        time: "18:00"
#        sunday: "10:00"
#
#  Час беріть у лапки: "09:55", а не 09:55 — без лапок YAML може
#  прочитати його як число.
# ───────────────────────────────────────────────────────────────

