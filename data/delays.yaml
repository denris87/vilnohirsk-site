# ───────────────────────────────────────────────────────────────
#  Затримки електричок — Вільногірськ (ручне оповіщення)
# ───────────────────────────────────────────────────────────────
#  Тут вручну вписуєш електрички, які затримуються. Блок одразу
#  з'являється яскравим банером ВГОРІ вкладки «Електрички».
#
#  ДВА РІВНІ ПЕРЕМИКАЧА show: true / false
#    • show УГОРІ файлу       → вмикає / вимикає ВЕСЬ блок затримок.
#    • show У РЯДКУ затримки   → ховає / показує ОКРЕМУ затримку
#                               (зручно вимкнути непотрібне, не видаляючи).
#
#  Кожна затримка — окремий пункт у списку delays:
#    number  — номер поїзда у лапках, напр. "6008"
#    route   — маршрут, напр. "П'ятихатки-Пас. → Дніпро-Гол."
#    station — станція відправлення; на сайті покажеться як «прямує зі ст. …»
#    delay   — затримка. Пиши так, як хочеш бачити на сайті:
#                delay: 45       → 45 хвилин          (на сайті «+45 хв»)
#                delay: "1:15"   → 1 година 15 хвилин (на сайті «+1.15 год»)
#              Години — ЗАВЖДИ в лапках і через двокрапку: "1:15", "2:00".
#              Без лапок YAML з’їдає нулі, і "2:00" стало б двома хвилинами.
#              Можна й окремим полем:  hours: 1  разом із  delay: 15
#    show    — true/false: показувати цю затримку (необов'язково, типово true)
#    note    — необов'язковий коментар (причина / коли оновлено)
#
#  ЯК ДОДАТИ ЗАТРИМКУ:
#    1. Знайди блок-ШАБЛОН нижче (рядки з «# - number:»).
#    2. Прибери на початку «# » у потрібних рядках.
#    3. Впиши свої дані. Для кількох затримок повтори блок стільки
#       разів, скільки треба (кожна нова починається з «- number:»).
#  ЯК ВИМКНУТИ ОДНУ: постав їй show: false (лишиться у файлі, але сховається).
#  ЯК ПРИБРАТИ ВСЕ: постав show: false угорі файлу.
#
#  ⚠️ Відступи (пробіли) важливі — не міняй їх, лише текст у лапках.
# ───────────────────────────────────────────────────────────────

