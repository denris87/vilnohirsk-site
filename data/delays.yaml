# ───────────────────────────────────────────────────────────────
#  Затримки електричок — Вільногірськ (ручне оповіщення)
# ───────────────────────────────────────────────────────────────
#  Тут вручну вписуєш електрички, які затримуються. Блок одразу
#  з'являється яскравим банером ВГОРІ вкладки «Електрички».
#
#  Перемикач усього блоку:
#    show: true   — показувати затримки на сайті
#    show: false  — сховати весь блок (швидко вимкнути, не видаляючи дані)
#
#  Кожна затримка — окремий пункт у списку delays:
#    number  — номер поїзда у лапках, напр. "6008"
#    route   — маршрут, напр. "П'ятихатки-Пас. → Дніпро-Гол."
#    station — станція відправлення (зазвичай "Вільногірськ")
#    delay   — затримка у хвилинах, ЧИСЛО (покажеться як "+15 хв")
#    note    — необов'язковий коментар (причина / коли оновлено)
#
#  ЯК ДОДАТИ ЗАТРИМКУ:
#    1. Знайди блок-ШАБЛОН нижче (рядки, що починаються з «# - number:»).
#    2. Прибери на початку «# » у потрібних рядках.
#    3. Впиши свої дані. Для кількох затримок повтори блок стільки
#       разів, скільки треба (кожна нова починається з «- number:»).
#  ЯК ПРИБРАТИ: видали його рядки або постав show: false (сховати все).
#
#  ⚠️ Відступи (пробіли) важливі — не міняй їх, лише текст у лапках.
# ───────────────────────────────────────────────────────────────

