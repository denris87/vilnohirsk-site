# ───────────────────────────────────────────────────────────────
#  Графік відключень світла — Вільногірськ (ручні дані)
# ───────────────────────────────────────────────────────────────
#  Блок показується замість радіо. У згорнутому вигляді одразу видно,
#  у яких чергах є відключення (⚡ червоним), а які без (зеленим).
#  Натискання відкриває велике вікно з часом відключень.
#
#  Перемикач:
#    show: true   — показувати блок (і без відключень: тоді плашка зелена,
#                   «✅ Відключень немає»)
#    show: false  — сховати блок; на його місці тоді показується радіо
#
#  Структура:
#    providers — список постачальників (ЦЕК, ДТЕК, ...).
#      name   — назва (показується кольоровою плашкою)
#      color  — колір плашки (hex)
#      queues — список черг цього постачальника:
#        queue — номер черги у лапках, напр. "2.2"
#        slots — час відключень, ДО 4 інтервалів, напр. "08:00-11:00".
#                Порожньо  slots: []  → «без відключень» (зелене).
#
#  ⚠️ НИЖЧЕ — ПРИКЛАД. Заміни на реальний графік (час у slots) і онови
#     дату updated. Відступи (пробіли) важливі — міняй лише текст у лапках.
# ───────────────────────────────────────────────────────────────

show: true
updated: "05.11.2026"
revised: ""

providers:
  - name: "ЦЕК"
    color: "#ff9f43"
    queues:
      - queue: "2.2"
        slots: ["02:00-05:30", "09:00-16:00", "23:00-24:00"]
      - queue: "4.2"
        slots: ["05:30-09:00", "16:00-19:30", "23:00-24:00"]
      - queue: "6.2"
        slots: ["00:00-02:00", "08:00-12:30", "19:30-23:00"]

  - name: "ДТЕК"
    color: "#38bdf8"
    queues:
      - queue: "1.1"
        slots: ["00:00-02:30", "09:00-12:30", "19:30-24:00"]
