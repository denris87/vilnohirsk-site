# ───────────────────────────────────────────────────────────────
#  Повітряна тривога — ТІЛЬКИ Дніпропетровська область
# ───────────────────────────────────────────────────────────────
#  Розділ показує стан тривоги по нашій області та її 7 районах.
#  Інші області України навмисно вимкнені й на карту не потрапляють.
#
#  Дані тягнуться автоматично з відкритого API — вручну нічого
#  заповнювати не треба. Цей файл потрібен лише щоб вмикати/вимикати
#  блок і підкручувати поведінку.
#
#  Перемикач:
#    show: true   — показувати розділ і плашку вгорі сайту
#    show: false  — сховати повністю (плашка й вкладка зникають)
# ───────────────────────────────────────────────────────────────

show: true

# ───────────────────────────────────────────────────────────────
#  ДЖЕРЕЛА ДАНИХ
# ───────────────────────────────────────────────────────────────
#  Сайт пробує джерела ЗВЕРХУ ВНИЗ і бере перше, що відповіло.
#  Формат відповіді розпізнається автоматично, тому сюди можна
#  дописати будь-який сумісний API — код підлаштується сам.
#
#    name — довільна підпис (видно тільки в консолі браузера)
#    url  — адреса API
#    show — false вимикає джерело, не видаляючи його
#
#  ⚠️ Не вставляйте сюди приватні токени! Файл лежить на сайті,
#     і токен побачить будь-хто. Якщо потрібен API з токеном
#     (напр. alerts.in.ua) — підніміть проксі на своєму сервері
#     і впишіть сюди адресу проксі, а токен лишіть на сервері.
# ───────────────────────────────────────────────────────────────

sources:
  - name: "Ubilling (без ключа)"
    url: "https://ubilling.net.ua/aerialalerts/"
    show: true

  # Приклад запасного джерела через власний проксі (токен — на сервері!)
  # - name: "alerts.in.ua через проксі"
  #   url: "https://ваш-сервер.up.railway.app/api/alerts"
  #   show: false

# ───────────────────────────────────────────────────────────────
#  РАЙОНИ
# ───────────────────────────────────────────────────────────────
#  Список фіксований — це 7 районів Дніпропетровщини (устрій 2020).
#  show: false ховає район зі списку й з карти (напр. якщо не цікавий).
#  home: true — «наш» район, підсвічується окремо. Вільногірськ
#  входить до Кам'янського району.
# ───────────────────────────────────────────────────────────────

raions:
  - name: "Кам'янський район"
    home: true
    show: true
  - name: "Дніпровський район"
    show: true
  - name: "Криворізький район"
    show: true
  - name: "Нікопольський район"
    show: true
  - name: "Павлоградський район"
    show: true
  - name: "Синельниківський район"
    show: true
  - name: "Новомосковський район"     # з 2024 — Самарівський
    show: true

# ───────────────────────────────────────────────────────────────
#  ЗВУК
# ───────────────────────────────────────────────────────────────
#  Сирена при початку тривоги. Вмикає її сам користувач кнопкою
#  в розділі (браузер не дає грати звук без дозволу).
#    allow: false — прибрати кнопку звуку взагалі
# ───────────────────────────────────────────────────────────────

sound:
  allow: true

# ───────────────────────────────────────────────────────────────
#  РУЧНЕ КЕРУВАННЯ (аварійний режим)
# ───────────────────────────────────────────────────────────────
#  Якщо API лежить, а сказати людям треба — вмикається вручну.
#  Ручне значення має пріоритет над будь-яким API.
#
#    active: true   — показати тривогу
#    active: false  — показати «тривоги немає»
#    active: null   — (за замовчуванням) брати дані з API
#
#  Не забудьте повернути active: null, коли API запрацює!
# ───────────────────────────────────────────────────────────────

manual:
  active: null
  # Час початку у форматі "ГГ:ХХ ДД.ММ.РРРР", напр. "14:30 11.08.2026".
  # Порожньо — лічильник тривалості просто не показується.
  since: ""
  # Свій текст замість стандартного (порожньо = стандартний).
  note: ""
