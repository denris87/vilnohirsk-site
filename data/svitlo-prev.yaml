# ───────────────────────────────────────────────────────────────
#  Графік відключень світла — Вільногірськ (ручні дані)
# ───────────────────────────────────────────────────────────────
#  Блок показується смугою на всю ширину під датою й погодою: «💡 Відключення
#  світла на <дата>» (або зелене «✅ Відключень немає»). Натискання відкриває
#  велике вікно з чергами й часом відключень.
#
#  Перемикач:
#    show: true   — показувати блок (і без відключень: тоді плашка зелена,
#                   «✅ Відключень немає»)
#    show: false  — сховати смугу графіка (радіо в картці з погодою є завжди)
#
#  Структура:
#    providers — список постачальників (ЦЕК, ДТЕК, ...).
#      name   — назва (показується кольоровою плашкою)
#      color  — колір плашки (hex)
#      queues — список черг цього постачальника:
#        queue — номер черги у лапках, напр. "2.2"
#        slots — час відключень, ДО 4 інтервалів, напр. "08:00-11:00".
#                Порожньо  slots: []  → «без відключень» (зелене).
#
#  ⚠️ НИЖЧЕ — ПРИКЛАД. Заміни на реальний графік (час у slots) і онови
#     дату updated. Відступи (пробіли) важливі — міняй лише текст у лапках.
# ───────────────────────────────────────────────────────────────

show: true
updated: "23.11.2026"
revised: "11:31 23.11.2026"

providers:
  - name: "ЦЕК"
    color: "#ff9f43"
    queues:
      - queue: "2.2"
        slots: ["11:00-14:30", "18:00-24:00"]
      - queue: "4.2"
        slots: ["14:30-18:00", "21:30-24:00"]
      - queue: "6.2"
        slots: ["18:00-21:30"]

  - name: "ДТЕК"
    color: "#38bdf8"
    queues:
      - queue: "1.1"
        slots: ["07:30-15:00", "18:00-22:00"]
