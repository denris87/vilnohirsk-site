# ───────────────────────────────────────────────────────────────
#  Збори на ЗСУ — розділ «Допомога ЗСУ»
# ───────────────────────────────────────────────────────────────
#  Формат такий самий, як був у сервері зборів — можна копіювати
#  записи один в один.
#
#  ЯК ПОКАЗАТИ ЗБІР:  active: true
#  ЯК СХОВАТИ ЗБІР:   active: false  (лишається у файлі, але не показується)
#
#  Поля кожного збору:
#    title       — назва збору (обов'язково)
#    description — опис; для кількох рядків використовуй | (див. приклад унизу)
#    jar_url     — посилання на банку monobank (лише https://…)
#    card_number — номер картки для переказу
#    goal        — ціль збору, число: 7000   (якщо 0 або немає — смужка прогресу не показується)
#    collected   — скільки вже зібрано, число: 0
#    active      — true/false: показувати цей збір
#
#  Зборів може бути кілька — просто повтори блок, що починається з «- title:».
#
#  ⚠️ Відступи (пробіли) важливі — не міняй їх, лише текст у лапках і числа.
# ───────────────────────────────────────────────────────────────

volunteers:
