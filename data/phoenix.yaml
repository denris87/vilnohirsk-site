# ───────────────────────────────────────────────────────────────
#  ФЕНІКС — розшук зниклих безвісти захисників Вільногірська
# ───────────────────────────────────────────────────────────────
#  Дані показуються на вкладці «ФЕНІКС (розшук)».
#
#  ЯК ДОДАТИ ЛЮДИНУ:
#    1. Скопіюй будь-який блок нижче (від «- name:» до «active:»).
#    2. Встав його в кінець списку й впиши свої дані.
#    3. Відступи (пробіли) не міняй — тільки текст у лапках.
#
#  ЯК ТИМЧАСОВО ПРИБРАТИ КАРТКУ:
#    постав їй active: false — вона лишиться у файлі, але зникне з сайту.
#
#  ПОЛЯ:
#    name         — прізвище, ім'я та по батькові
#    dob          — дата народження, напр. "23.12.1979" (можна лишити "")
#    date_missing — коли зник; можна писати й текстом, напр. "у полоні"
#    callsign     — позивний (можна лишити "")
#    photos       — список посилань на фото, кожне з нового рядка після «- »
#    active       — true показувати, false сховати
#
#  ФОТОГРАФІЇ лежать у репозиторії vilnohirsk-phoenix-api, тут лише посилання.
#  Можна вставляти і звичайні посилання, і локальні файли, напр. "./img/phoenix/ivanov.jpg".
#
#  ⚠️ Файл перевіряється автоматично: якщо зламати відступи, коміт отримає
#     червоний хрестик, а розділ на сайті сховається.
# ───────────────────────────────────────────────────────────────

