# ───────────────────────────────────────────────────────────────
#  Карта міста Вільногірськ — категорії та точки
# ───────────────────────────────────────────────────────────────
#  Як додати точку:
#    1. Знайди потрібну категорію нижче (або додай нову у список categories).
#    2. У її блоці "places:" додай рядок з name / lat / lng / address.
#    3. Координати (lat, lng) бери з Google Maps: ПКМ по місцю → клік на числа
#       (перше число = lat, друге = lng).
#
#  Перемикачі (увімкнути / вимкнути без видалення):
#    show: true   — показувати
#    show: false  — сховати
#    • show у блоці категорії  → ховає / показує ВСЮ категорію.
#    • show у рядку точки       → ховає / показує ОКРЕМУ точку.
#  Порожні категорії (без видимих точок) на карті не показуються.
# ───────────────────────────────────────────────────────────────

