# Автоперевірка файлів даних: якщо у data/*.yaml з'являється синтаксична
# помилка (випадковий символ, зламаний відступ) — коміт отримує червоний ✗
# і лист від GitHub. Сайт при зламаному файлі мовчки ховає відповідний блок,
# тому без цієї перевірки помилку легко не помітити.
name: validate-data
on:
  push:
    paths: [ 'data/*.yaml' ]
jobs:
  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Перевірка YAML-файлів даних
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import yaml, glob, sys
          bad = 0
          for f in sorted(glob.glob('data/*.yaml')):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
                  print('OK ', f)
              except Exception as e:
                  bad += 1
                  print('ПОМИЛКА', f, '->', str(e).replace('\n', ' | '))
          if bad:
              print(f'\nЗламаних файлів: {bad}. Сайт сховає ці блоки, поки помилку не виправлено!')
          sys.exit(1 if bad else 0)
          EOF
