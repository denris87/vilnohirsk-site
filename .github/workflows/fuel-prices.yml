name: fuel-prices

# Автооновлення цін на пальне «Укрнафти» у data/fuel.yaml.
# Правила й захисти — у шапці .github/scripts/update_fuel.py.
#
# Розклад у UTC. Київ — UTC+3 улітку й UTC+2 узимку (узимку все на годину раніше).
#   Будні:   кожні 30 хв з 05 до 18 UTC — 8:07–21:37 за Києвом улітку. Мінфін
#            публікує свіжі ціни раз на день, десь між 13:00 і 15:30.
#            Таймер GitHub пропускає більшість запусків за розкладом, тож запуск,
#            який таки стартував, не закінчується, поки свіжих цін немає: сам
#            перевіряє мінфін знову кожні 30 хв (до 5 год, не пізніше 21:00 за
#            Києвом). Щойно ціни з'явились — комітить їх і завершується.
#   Вихідні: о 05 і 09 UTC — 8:07 і 12:07 за Києвом улітку. Мінфін у вихідні
#            не оновлюється, тож бот лише переносить дату на сьогодні, лишаючи
#            п'ятничні ціни. Два запуски — про запас: GitHub інколи пропускає
#            запуск за розкладом, а другий за потреби нічого не робить.
# Хвилини 7 і 37, а не 0 і 30: на початку години GitHub перевантажений і запізнюється.

on:
  schedule:
    - cron: '7,37 5-18 * * 1-5'
    - cron: '7 5,9 * * 0,6'
  workflow_dispatch:   # кнопка «Run workflow» на вкладці Actions — перевірити просто зараз (один раз)

permissions:
  contents: write      # закомітити data/fuel.yaml
  pages: write         # попросити GitHub Pages перезібрати сайт

# Запуски за розкладом ідуть по одному: поки один чекає на ціни, наступний стоїть
# у черзі (зайві з черги GitHub скасовує — це нормально, не помилка). Ручний запуск
# у цю чергу не стає, щоб кнопка спрацьовувала одразу.
concurrency:
  group: fuel-prices-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # очікування цін — до 5 год; довше 6 год GitHub задачу не тримає
    steps:
      - uses: actions/checkout@v4

      - name: Залежності
        run: python3 -m pip install --quiet pyyaml

      - name: Ціни з мінфіну
        env:
          WAIT_FOR_PRICES: ${{ github.event_name == 'schedule' }}
        run: |
          # Код 75 від скрипта: свіжих цін на мінфіні ще немає. Запуск за розкладом
          # тоді перевіряє знову через 30 хв — не довше 5 год і не пізніше 21:00
          # за Києвом. Ручний запуск перевіряє один раз.
          stop=$(( $(date +%s) + 5 * 3600 ))
          while true; do
            rc=0
            python3 .github/scripts/update_fuel.py data/fuel.yaml || rc=$?
            if [ "$rc" -ne 75 ]; then exit "$rc"; fi
            if [ "$WAIT_FOR_PRICES" != "true" ] || [ $(( $(date +%s) + 1800 )) -gt "$stop" ] \
               || [ "$(TZ=Europe/Kyiv date +%-H)" -ge 21 ]; then
              echo "Свіжих цін поки немає — перевірить наступний запуск"
              exit 0
            fi
            echo "Свіжих цін поки немає — наступна перевірка о $(TZ=Europe/Kyiv date -d '+30 min' +%H:%M) за Києвом"
            sleep 1800
            # За пів години файл могли поправити руками чи оновити ручним запуском
            git pull -q --rebase origin main || echo "::warning::Не вдалося підтягнути main — перевіряю на наявній копії"
          done

      - name: Закомітити, якщо змінилось
        id: commit
        run: |
          if git diff --quiet -- data/fuel.yaml; then
            echo "Файл не змінився — комітити нічого"
            exit 0
          fi
          day=$(sed -n 's/^updated: "\(.*\)"/\1/p' data/fuel.yaml)
          # В історії комітів одразу видно, коли ціни справді змінились
          if git diff -U0 -- data/fuel.yaml | grep -q '^+ *price:'; then
            msg="Ціни на пальне: нові ціни станом на ${day}"
          else
            msg="Ціни на пальне: ціни ті самі, дата ${day}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "$msg" -- data/fuel.yaml
          # Поки бот працював, у main міг лягти чийсь коміт — підтягуємо й пробуємо ще раз
          git push -q || { git pull -q --rebase && git push -q; }
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Перезібрати сайт
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Коміт від GITHUB_TOKEN може сам не запустити збірку GitHub Pages,
          # тож просимо явно. Якщо збірка й так пішла, повторна перезбірка
          # того самого нічого не ламає.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent \
            && echo "Збірку сайту запитано" \
            || echo "::warning::Не вдалося запитати збірку GitHub Pages — сайт оновиться з наступним комітом"
